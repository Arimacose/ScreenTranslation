name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint, debug APK, and R8 release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run verification build
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Verify JNI and reflected classes after R8
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -s "$apk"
          test -x "$apkanalyzer"

          mapfile -t registrars < <(
            "$apkanalyzer" manifest print "$apk" |
              sed -n 's/.*android:name="com.google.firebase.components:\([^"]*\)".*/\1/p'
          )
          ((${#registrars[@]} > 0))

          for registrar in "${registrars[@]}"; do
            registrar_code="$("$apkanalyzer" dex code --class "$registrar" "$apk")"
            if ! grep -Fq '.method public constructor <init>()V' <<<"$registrar_code"; then
              echo "::error::R8 removed ComponentRegistrar constructor: $registrar"
              exit 1
            fi
          done

          tensor_code="$("$apkanalyzer" dex code --class ai.onnxruntime.OnnxTensor "$apk")"
          session_code="$("$apkanalyzer" dex code --class ai.onnxruntime.OrtSession "$apk")"
          grep -Fq '.class public Lai/onnxruntime/OnnxTensor;' <<<"$tensor_code" || {
            echo "::error::R8 removed or renamed ai.onnxruntime.OnnxTensor"
            exit 1
          }
          grep -Fq '.method public static createTensor(' <<<"$tensor_code" || {
            echo "::error::R8 removed or renamed OnnxTensor.createTensor"
            exit 1
          }
          grep -Fq '.method private native run(' <<<"$session_code" || {
            echo "::error::R8 removed or renamed OrtSession.run JNI binding"
            exit 1
          }

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ScreenTranslation-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/outputs/mapping/release/configuration.txt
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/seeds.txt
            app/build/outputs/mapping/release/usage.txt
          if-no-files-found: warn
          retention-days: 14
