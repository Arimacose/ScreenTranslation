name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_BUILD_TOOLS: "37.0.0"
  BERGAMOT_NDK: "23.1.7779620"
  HYMT2_NDK: "29.0.14206865"
  ANDROID_CMAKE: "3.31.6"

jobs:
  build:
    name: Verify Lite, Full, and Online editions
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source and native submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Recompute canonical translation admission evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -B -m unittest tools/provider-admission/test_verify_translation_admission.py -v
          python -B tools/provider-admission/verify_translation_admission.py --check

      - name: Verify public translation regression fixtures and gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/model-benchmark-venv"
          source "$RUNNER_TEMP/model-benchmark-venv/bin/activate"
          python -m pip install --disable-pip-version-check \
            -r tools/model-benchmark/requirements.txt
          python tools/model-benchmark/translation_regression.py validate \
            --output app/build/model-benchmark/translation-regression/validation.json
          python tools/model-benchmark/translation_regression.py smoke \
            --output app/build/model-benchmark/translation-regression/harness-smoke.json
          python -m unittest discover \
            -s tools/model-benchmark -p "test_*.py" -v

      - name: Verify versioned third-party license bundle
        shell: bash
        run: |
          set -euo pipefail
          ort_version="$(
            sed -n \
              's/.*com\.microsoft\.onnxruntime:onnxruntime-android:\([^"]*\)".*/\1/p' \
              app/build.gradle.kts
          )"
          [[ "$ort_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -d \
            "third_party/licenses/common/licenses/onnxruntime-$ort_version"
          grep -Fq \
            "| ONNX Runtime for Android | $ort_version |" \
            THIRD_PARTY_NOTICES.md
          grep -Fq \
            "ONNX Runtime Android \`$ort_version\`" \
            README.md
          (
            cd third_party/licenses
            sha256sum -c SHA256SUMS
          )

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android 16 and native toolchains
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-36" \
            "platforms;android-37.0" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$BERGAMOT_NDK" \
            "ndk;$HYMT2_NDK" \
            "cmake;$ANDROID_CMAKE"

      - name: Run edition verification builds
        run: |
          ./gradlew --no-daemon --stacktrace \
            testLiteDebugUnitTest \
            testFullDebugUnitTest \
            testOnlineDebugUnitTest \
            lintLiteRelease \
            lintFullRelease \
            lintOnlineRelease \
            generateReleaseSboms \
            assembleOnlineContributor \
            assembleLiteRelease \
            assembleFullRelease \
            assembleOnlineRelease \
            bundleLiteRelease \
            bundleFullRelease \
            bundleOnlineRelease

      - name: Generate and verify fresh JVM Online failure evidence
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/model-benchmark-venv/bin/activate"
          original_gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          fresh_gradle_home="$RUNNER_TEMP/fresh-online-gradle-home"
          mkdir -p "$fresh_gradle_home"
          for reusable_dir in caches wrapper; do
            if [[ -d "$original_gradle_home/$reusable_dir" ]]; then
              ln -s "$original_gradle_home/$reusable_dir" \
                "$fresh_gradle_home/$reusable_dir"
            fi
          done
          export GRADLE_USER_HOME="$fresh_gradle_home"
          python tools/model-benchmark/online_failure_evidence.py \
            --output app/build/model-benchmark/translation-regression/online-failure-evidence.json

      - name: Verify R8, edition metadata, OCR assets, and backend isolation
        shell: bash
        run: |
          set -euo pipefail
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          aapt="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt"
          version_info="$(./gradlew -q :app:printVersionInfo)"
          expected_version_name="$(
            printf '%s\n' "$version_info" | sed -n 's/^versionName=//p'
          )"
          expected_version_code="$(
            printf '%s\n' "$version_info" | sed -n 's/^versionCode=//p'
          )"
          test -x "$apkanalyzer"
          test -x "$aapt"
          [[ "$expected_version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$expected_version_code" =~ ^[1-9][0-9]*$ ]]

          find_apk() {
            local edition="$1"
            local output_dir="app/build/outputs/apk/$edition/release"
            mapfile -t candidates < <(
              find "$output_dir" -maxdepth 1 -type f -name '*.apk' -print
            )
            if [[ "${#candidates[@]}" -ne 1 ]]; then
              echo "::error::Expected one $edition release APK, found ${#candidates[@]}"
              exit 1
            fi
            printf '%s\n' "${candidates[0]}"
          }

          assert_entry() {
            local listing="$1"
            local entry="$2"
            if ! grep -Fxq "$entry" <<<"$listing"; then
              echo "::error::Missing APK entry: $entry"
              exit 1
            fi
          }

          reject_entry() {
            local listing="$1"
            local entry="$2"
            if grep -Fxq "$entry" <<<"$listing"; then
              echo "::error::Unexpected APK entry: $entry"
              exit 1
            fi
          }

          verify_common() {
            local apk="$1"
            local expected_id="$2"
            local expected_name="$3"
            local expected_label_token="$4"
            local listing="$5"
            local badging

            [[ "$("$apkanalyzer" manifest application-id "$apk")" == "$expected_id" ]]
            [[ "$("$apkanalyzer" manifest version-code "$apk")" == "$expected_version_code" ]]
            [[ "$("$apkanalyzer" manifest version-name "$apk")" == "$expected_name" ]]
            [[ "$("$apkanalyzer" manifest target-sdk "$apk")" == "36" ]]
            badging="$("$aapt" dump badging "$apk")"
            grep -F 'application-label:' <<<"$badging" |
              grep -Fq "$expected_label_token"

            assert_entry "$listing" "assets/ppocrv6_small/det.onnx"
            assert_entry "$listing" "assets/ppocrv6_small/rec.onnx"
            assert_entry "$listing" "assets/ppocrv6_small/characters.txt"
            assert_entry "$listing" "assets/licenses/COMMON.md"
            assert_entry "$listing" "assets/licenses/APACHE-2.0.txt"
            assert_entry "$listing" \
              "assets/licenses/models/PP-OCRv6.md"
            assert_entry "$listing" \
              "assets/licenses/onnxruntime-1.28.0/LICENSE.txt"
            assert_entry "$listing" \
              "assets/licenses/onnxruntime-1.28.0/ThirdPartyNotices.txt"

            if grep -Eiq \
              '^assets/.+\.(gguf|bin|marian|model|npz|safetensors|spm)$' \
              <<<"$listing"
            then
              echo "::error::Translation model weights must be downloaded at runtime"
              exit 1
            fi

            tensor_code="$("$apkanalyzer" dex code --class ai.onnxruntime.OnnxTensor "$apk")"
            session_code="$("$apkanalyzer" dex code --class ai.onnxruntime.OrtSession "$apk")"
            grep -Fq '.class public Lai/onnxruntime/OnnxTensor;' <<<"$tensor_code"
            grep -Fq '.method public static createTensor(' <<<"$tensor_code"
            grep -Fq '.method private native run(' <<<"$session_code"
          }

          lite_apk="$(find_apk lite)"
          full_apk="$(find_apk full)"
          online_apk="$(find_apk online)"
          lite_listing="$(unzip -Z1 "$lite_apk")"
          full_listing="$(unzip -Z1 "$full_apk")"
          online_listing="$(unzip -Z1 "$online_apk")"

          verify_common \
            "$lite_apk" \
            "com.screentranslation.app" \
            "${expected_version_name}-lite" \
            "ScreenTranslation Lite" \
            "$lite_listing"
          assert_entry "$lite_listing" "lib/arm64-v8a/libbergamot_runner.so"
          assert_entry "$lite_listing" "assets/licenses/LITE.md"
          assert_entry "$lite_listing" \
            "assets/licenses/FIREFOX-TRANSLATIONS-MODELS.md"
          assert_entry "$lite_listing" \
            "assets/licenses/FIREFOX-TRANSLATIONS-MPL-2.0.txt"
          assert_entry "$lite_listing" \
            "assets/licenses/bergamot-9271618/MPL-2.0.txt"
          assert_entry "$lite_listing" \
            "assets/licenses/bergamot-9271618/SOURCE-CODE.md"
          assert_entry "$lite_listing" \
            "assets/licenses/bergamot-9271618/STATIC_DEPENDENCIES.md"
          reject_entry "$lite_listing" "lib/arm64-v8a/libhymt2_jni.so"
          reject_entry "$lite_listing" "lib/arm64-v8a/libtranslate_jni.so"

          verify_common \
            "$full_apk" \
            "com.screentranslation.app.full" \
            "${expected_version_name}-full" \
            "HY-MT2 Q4 Experimental" \
            "$full_listing"
          assert_entry "$full_listing" "lib/arm64-v8a/libhymt2_jni.so"
          assert_entry "$full_listing" "assets/licenses/FULL.md"
          assert_entry "$full_listing" \
            "assets/licenses/ANDROID-NDK-r29-NOTICE.txt"
          assert_entry "$full_listing" \
            "assets/licenses/llama.cpp-caa596ab3/LICENSE.txt"
          assert_entry "$full_listing" \
            "assets/licenses/llama.cpp-caa596ab3/KLEIDIAI_NOTICE.txt"
          assert_entry "$full_listing" \
            "assets/licenses/models/HY-MT2-1.8B-GGUF.md"
          assert_entry "$full_listing" \
            "assets/licenses/models/HY-MT2-1.8B-GGUF-LICENSE.txt"
          reject_entry "$full_listing" "lib/arm64-v8a/libbergamot_runner.so"
          reject_entry "$full_listing" "lib/arm64-v8a/libtranslate_jni.so"

          verify_common \
            "$online_apk" \
            "com.screentranslation.app.online" \
            "${expected_version_name}-online" \
            "识屏翻译 Online" \
            "$online_listing"
          assert_entry "$online_listing" "assets/licenses/ONLINE.md"
          reject_entry "$online_listing" "lib/arm64-v8a/libbergamot_runner.so"
          reject_entry "$online_listing" "lib/arm64-v8a/libhymt2_jni.so"
          reject_entry "$online_listing" "lib/arm64-v8a/libtranslate_jni.so"
          grep -Fq 'okhttp3.OkHttpClient ->' \
            app/build/outputs/mapping/onlineRelease/mapping.txt
          grep -Fq 'boolean isConfigurationReady(android.content.Context)' \
            app/build/outputs/mapping/onlineRelease/mapping.txt

          contributor_apk="app/build/outputs/apk/online/contributor/app-online-contributor.apk"
          test -f "$contributor_apk"
          contributor_listing="$(unzip -Z1 "$contributor_apk")"
          assert_entry "$contributor_listing" "lib/x86_64/libonnxruntime.so"
          if grep -Eq '^lib/arm64-v8a/' <<<"$contributor_listing"; then
            echo "::error::Online contributor APK contains release-only arm64 libraries"
            exit 1
          fi
          for release_listing in "$lite_listing" "$full_listing" "$online_listing"; do
            if grep -Eq '^lib/x86_64/' <<<"$release_listing"; then
              echo "::error::Release APK contains contributor-only x86_64 libraries"
              exit 1
            fi
          done

      - name: Verify per-edition CycloneDX SBOMs
        shell: bash
        run: |
          set -euo pipefail
          version="$(./gradlew -q :app:printVersionInfo | sed -n 's/^versionName=//p')"
          python tools/release/verify_sbom.py \
            app/build/reports/sbom \
            --version "$version"

      - name: Upload edition build outputs
        uses: actions/upload-artifact@v7
        with:
          name: ScreenTranslation-editions-${{ github.sha }}
          path: |
            app/build/outputs/apk/lite/release/*.apk
            app/build/outputs/apk/full/release/*.apk
            app/build/outputs/apk/online/release/*.apk
            app/build/outputs/apk/online/contributor/*.apk
            app/build/outputs/bundle/liteRelease/app-lite-release.aab
            app/build/outputs/bundle/fullRelease/app-full-release.aab
            app/build/outputs/bundle/onlineRelease/app-online-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            app/build/reports/lint-results-liteRelease.html
            app/build/reports/lint-results-fullRelease.html
            app/build/reports/lint-results-onlineRelease.html
            app/build/reports/tests/testLiteDebugUnitTest/
            app/build/reports/tests/testFullDebugUnitTest/
            app/build/reports/tests/testOnlineDebugUnitTest/
            app/build/outputs/mapping/liteRelease/
            app/build/outputs/mapping/fullRelease/
            app/build/outputs/mapping/onlineRelease/
            app/build/model-benchmark/translation-regression/
            app/build/reports/sbom/*.cdx.json
          if-no-files-found: warn
          retention-days: 14

  instrumentation:
    name: Injected capture E2E and host macrobenchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source and native submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android compile SDKs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-36" \
            "platforms;android-37.0" \
            "build-tools;$ANDROID_BUILD_TOOLS"

      - name: Validate pinned macrobenchmark thresholds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("app/src/test/resources/v2_4_macrobenchmark_thresholds.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["schema_version"] == 1
          assert data["fixture_set"] == "v2.4.0-fixed-en-ja-mixed-v1"
          assert data["minimum_iterations"] >= 5
          for key in (
              "startup_ms_p95_max",
              "frame_processing_ms_p95_max",
              "jank_percent_max",
              "memory_pss_mb_max",
          ):
              assert data[key] > 0
          PY

      - name: Run edition-isolated injected capture journeys
        run: >-
          ./gradlew --no-daemon --stacktrace
          testLiteDebugUnitTest
          testFullDebugUnitTest
          testOnlineDebugUnitTest
          --tests '*InjectedCaptureJourneyTest'

      - name: Enable KVM group permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API 36 instrumentation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none
          script: >-
            ./gradlew --no-daemon --stacktrace
            :app:connectedOnlineInstrumentationAndroidTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: injected-e2e-and-instrumentation-reports-${{ github.sha }}
          path: |
            app/build/reports/androidTests/connected/instrumentation/
            app/build/outputs/androidTest-results/connected/instrumentation/
          if-no-files-found: warn
          retention-days: 14
