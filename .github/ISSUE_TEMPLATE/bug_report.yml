name: Bug 报告
description: 报告可复现的崩溃、识别、翻译、权限或设备兼容问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先移除截图、OCR 文本、通知和日志中的账号、消息、支付、位置等敏感信息。

  - type: dropdown
    id: area
    attributes:
      label: 问题区域
      options:
        - 屏幕共享 / MediaProjection
        - 悬浮窗 / 框选区域
        - OCR
        - 翻译与模型下载
        - 前台服务 / 通知
        - 构建、安装或发布包
        - 性能、功耗或稳定性
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 填写版本号、Git commit 或 APK SHA-256。
      placeholder: 0.1.0 / abc1234 / SHA-256
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与 ROM
      placeholder: 小米 15 Pro / HyperOS OS3.x
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android 版本与 API
      placeholder: Android 16 / API 36
    validations:
      required: true

  - type: input
    id: languages
    attributes:
      label: 语言对
      description: OCR 或翻译问题请填写。
      placeholder: 英语 → 简体中文

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从应用冷启动开始，给出最短稳定复现路径。
      placeholder: |
        1. 打开应用……
        2. 授予……
        3. 框选……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 包含频率、错误文字和是否可恢复；敏感内容请改写。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏证据
      description: 可粘贴相关 logcat、录屏或截图。仅保留问题前后最小范围。
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue，未发现相同问题。
          required: true
        - label: 我已移除私人屏幕内容、令牌、账号和签名材料。
          required: true
        - label: 我已说明测试所用 commit、版本或 APK 哈希。
          required: true
