name: 功能建议
description: 提议可维护、可测试且符合隐私边界的新能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请从用户问题和验收标准出发。涉及上传屏幕内容、后台捕获或新增权限时，必须说明数据流与风险。

  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 现在什么场景受阻，影响哪些用户？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述交互、数据流和预期行为，而不只写实现技术。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      placeholder: |
        - [ ] 条件 A 下……
        - [ ] 条件 B 下……
        - [ ] 有对应测试或真机证据……
    validations:
      required: true

  - type: dropdown
    id: privacy
    attributes:
      label: 隐私与权限影响
      options:
        - 不改变现有数据流或权限
        - 改变本地数据保存
        - 新增网络数据传输
        - 新增 Android 权限或系统能力
        - 尚需威胁建模
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的其他方案

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue 与路线图。
          required: true
        - label: 我已避免附带真实私人屏幕内容或凭据。
          required: true
