name: Signed release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Validate signing secrets
        shell: bash
        run: |
          missing=0
          for name in \
            RELEASE_KEYSTORE_BASE64 \
            RELEASE_STORE_PASSWORD \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]]

      - name: Materialize release keystore
        shell: bash
        run: |
          key_store="$RUNNER_TEMP/screen-translation-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key_store"
          test -s "$key_store"
          echo "ANDROID_RELEASE_STORE_FILE=$key_store" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify tag and app version
        id: version
        shell: bash
        run: |
          version_info="$(./gradlew -q :app:printVersionInfo)"
          version_name="$(printf '%s\n' "$version_info" | sed -n 's/^versionName=//p')"
          version_code="$(printf '%s\n' "$version_info" | sed -n 's/^versionCode=//p')"
          test -n "$version_name"
          test -n "$version_code"
          if [[ "$GITHUB_REF_NAME" != "v$version_name" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version_name"
            exit 1
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Run release verification build
        run: ./gradlew --no-daemon --stacktrace clean testDebugUnitTest lintRelease assembleRelease bundleRelease

      - name: Verify JNI and reflected classes after R8
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -s "$apk"
          test -x "$apkanalyzer"

          mapfile -t registrars < <(
            "$apkanalyzer" manifest print "$apk" |
              sed -n 's/.*android:name="com.google.firebase.components:\([^"]*\)".*/\1/p'
          )
          ((${#registrars[@]} > 0))

          for registrar in "${registrars[@]}"; do
            registrar_code="$("$apkanalyzer" dex code --class "$registrar" "$apk")"
            if ! grep -Fq '.method public constructor <init>()V' <<<"$registrar_code"; then
              echo "::error::R8 removed ComponentRegistrar constructor: $registrar"
              exit 1
            fi
          done

          tensor_code="$("$apkanalyzer" dex code --class ai.onnxruntime.OnnxTensor "$apk")"
          session_code="$("$apkanalyzer" dex code --class ai.onnxruntime.OrtSession "$apk")"
          grep -Fq '.class public Lai/onnxruntime/OnnxTensor;' <<<"$tensor_code" || {
            echo "::error::R8 removed or renamed ai.onnxruntime.OnnxTensor"
            exit 1
          }
          grep -Fq '.method public static createTensor(' <<<"$tensor_code" || {
            echo "::error::R8 removed or renamed OnnxTensor.createTensor"
            exit 1
          }
          grep -Fq '.method private native run(' <<<"$session_code" || {
            echo "::error::R8 removed or renamed OrtSession.run JNI binding"
            exit 1
          }

      - name: Verify and stage artifacts
        id: artifacts
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"

          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 -v 4 "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk"

          version="${{ steps.version.outputs.version_name }}"
          mkdir -p dist
          cp "$apk" "dist/ScreenTranslation-$version.apk"
          cp "$aab" "dist/ScreenTranslation-$version.aab"
          cp LICENSE "dist/ScreenTranslation-$version-LICENSE.txt"
          cp THIRD_PARTY_NOTICES.md "dist/ScreenTranslation-$version-THIRD-PARTY.md"
          (
            cd dist
            sha256sum \
              "ScreenTranslation-$version.apk" \
              "ScreenTranslation-$version.aab" \
              "ScreenTranslation-$version-LICENSE.txt" \
              "ScreenTranslation-$version-THIRD-PARTY.md" \
              > SHA256SUMS
          )

      - name: Preserve R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: ScreenTranslation-${{ steps.version.outputs.version_name }}-mapping
          path: |
            app/build/outputs/mapping/release/configuration.txt
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/seeds.txt
            app/build/outputs/mapping/release/usage.txt
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version_name }}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/ScreenTranslation-$version.apk" \
            "dist/ScreenTranslation-$version.aab" \
            "dist/ScreenTranslation-$version-LICENSE.txt" \
            "dist/ScreenTranslation-$version-THIRD-PARTY.md" \
            "dist/SHA256SUMS" \
            --verify-tag \
            --generate-notes \
            --title "ScreenTranslation $GITHUB_REF_NAME"

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/screen-translation-release.jks"
